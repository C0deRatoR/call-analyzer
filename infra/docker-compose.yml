name: conviq

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: conviq-postgres
    environment:
      POSTGRES_USER: conviq
      POSTGRES_PASSWORD: conviq
      POSTGRES_DB: conviq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conviq -d conviq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: conviq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: conviq-chroma
    expose:
      - "8000"
    volumes:
      - chroma_data:/chroma/chroma

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    container_name: conviq-api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://conviq:conviq@postgres:5432/conviq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      APP_ENV: production
    ports:
      - "8000:8000"
    volumes:
      - uploads:/tmp/conviq/uploads
      - hf_cache:/home/conviq/.cache/huggingface

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    container_name: conviq-worker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_started }
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://conviq:conviq@postgres:5432/conviq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      APP_ENV: production
    volumes:
      - uploads:/tmp/conviq/uploads
      - hf_cache:/home/conviq/.cache/huggingface

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  uploads:
  hf_cache:
